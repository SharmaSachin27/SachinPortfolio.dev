<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g., https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer (it is currently > 512 bytes)

      // If you're using a custom domain, set basePath to the path to the
      // repository on your domain, e.g., '/repo-name/'.
      // If you're using GitHub Pages default domain,
      // set basePath to the path to the repository, e.g., '/repo-name/'.
      var basePath = '/';

      var redirect = basePath + '?/' + window.location.pathname.slice(basePath.length) +
        (window.location.search ? '&' + window.location.search.slice(1).replace(/&/g, '~and~') : '') +
        window.location.hash;

      window.location.replace(redirect);
    </script>
  </head>
  <body>
  </body>
</html>
